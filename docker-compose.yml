services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wompi_subs
      POSTGRES_USER: wompi_subs
      POSTGRES_PASSWORD: wompi_subs
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wompi_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wompi_subs -d wompi_subs"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: node:20-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - web_prisma:/app/packages/database
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://wompi_subs:wompi_subs@postgres:5432/wompi_subs?schema=public
      ADMIN_API_TOKEN: dev-token-123456-change-in-production
      ADMIN_SESSION_SECRET: dev-session-secret-change-in-production-abc123xyz
      CREDENTIALS_ENCRYPTION_KEY_B64: mGBsjs4eVVtlDZ7yhyUlgzsLmvMeHqqGwhQnNfmB8QM=
      WOMPI_ACTIVE_ENV: PRODUCTION
      CHATWOOT_ACTIVE_ENV: PRODUCTION
      JOBS_HEARTBEAT_KEY: wompi-subs-jobs
      GAMIFICATION_RECALC_MINUTES: 60
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wompi_network
    command: >
      sh -c "cd apps/web && 
      npm install && 
      npx prisma generate --schema=../../packages/database/prisma/schema.prisma && 
      npm run dev"
    restart: unless-stopped

volumes:
  postgres_data:
  web_node_modules:
  web_prisma:

networks:
  wompi_network:
    driver: bridge
