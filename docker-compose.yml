services:
  postgres:
    container_name: wompi-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wompi_subs
      POSTGRES_USER: ${POSTGRES_USER:-wompi_subs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wompi_subs}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wompi_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wompi_subs} -d wompi_subs"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    container_name: wompi-admin
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3002
      DATABASE_URL: postgresql://wompi_subs:${POSTGRES_PASSWORD:-wompi_subs}@postgres:5432/wompi_subs?schema=public
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3002
      ADMIN_INTERNAL_API_BASE_URL: http://admin:3002
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SUPER_ADMIN_RESET_PASSWORD: ${SUPER_ADMIN_RESET_PASSWORD:-0}
      DEFAULT_TENANT_NAME: ${DEFAULT_TENANT_NAME:-apiflujos}
      CREDENTIALS_ENCRYPTION_KEY_B64: ${CREDENTIALS_ENCRYPTION_KEY_B64}
      WOMPI_API_BASE_URL: ${WOMPI_API_BASE_URL:-https://production.wompi.co/v1}
      WOMPI_ACTIVE_ENV: ${WOMPI_ACTIVE_ENV:-PRODUCTION}
      JOBS_HEARTBEAT_KEY: ${JOBS_HEARTBEAT_KEY:-wompi-subs-jobs}
      GAMIFICATION_RECALC_MINUTES: ${GAMIFICATION_RECALC_MINUTES:-60}
      CSP_PUBLIC_ALLOW_UNSAFE_INLINE: ${CSP_PUBLIC_ALLOW_UNSAFE_INLINE:-1}
      NEXT_PUBLIC_DISABLE_REALTIME: ${NEXT_PUBLIC_DISABLE_REALTIME:-0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wompi_network
    restart: unless-stopped

  jobs:
    container_name: wompi-jobs
    image: node:20-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - jobs_node_modules:/app/apps/worker/node_modules
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://wompi_subs:${POSTGRES_PASSWORD:-wompi_subs}@postgres:5432/wompi_subs?schema=public
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SUPER_ADMIN_RESET_PASSWORD: ${SUPER_ADMIN_RESET_PASSWORD:-0}
      DEFAULT_TENANT_NAME: ${DEFAULT_TENANT_NAME:-apiflujos}
      CREDENTIALS_ENCRYPTION_KEY_B64: ${CREDENTIALS_ENCRYPTION_KEY_B64}
      WOMPI_API_BASE_URL: ${WOMPI_API_BASE_URL:-https://production.wompi.co/v1}
      WOMPI_ACTIVE_ENV: ${WOMPI_ACTIVE_ENV:-PRODUCTION}
      JOBS_HEARTBEAT_KEY: ${JOBS_HEARTBEAT_KEY:-wompi-subs-jobs}
      GAMIFICATION_RECALC_MINUTES: ${GAMIFICATION_RECALC_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wompi_network
    command: sh -c "npm install --include=dev && npm -w packages/database run prisma:generate && npm -w apps/worker run start"
    restart: unless-stopped

volumes:
  postgres_data:
  jobs_node_modules:

networks:
  wompi_network:
    driver: bridge
